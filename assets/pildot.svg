<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pildot</title>
  <desc id="desc">A circular dot with a smooth battery gradient from green on the left through yellow and orange to red on the right.</desc>
  <defs>
    <linearGradient id="battery" x1="68" y1="512" x2="956" y2="512" gradientUnits="userSpaceOnUse" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#05be58"/>
      <stop offset="10%" stop-color="#05bf57"/>
      <stop offset="20%" stop-color="#28cf47"/>
      <stop offset="30%" stop-color="#73df2d"/>
      <stop offset="40%" stop-color="#d6ee13"/>
      <stop offset="50%" stop-color="#fcd50a"/>
      <stop offset="60%" stop-color="#fc9010"/>
      <stop offset="70%" stop-color="#fc4718"/>
      <stop offset="80%" stop-color="#fc1020"/>
      <stop offset="90%" stop-color="#fb0220"/>
      <stop offset="100%" stop-color="#fb011f"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="444" fill="url(#battery)"/>
</svg>
